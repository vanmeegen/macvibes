# Optionale LiteLLM-Bridge: bietet einen Anthropic-/v1/messages-Endpunkt und
# übersetzt Requests (inkl. Streaming + Tool-Calling) auf OpenAI-kompatible
# Anbieter (OpenRouter, OpenAI, jeder /chat/completions-Endpunkt).
#
# Das LOKALE Modell braucht diese Bridge NICHT mehr: oMLX spricht Anthropics
# /v1/messages nativ, und der Credential-Proxy schickt alle Nicht-Claude-
# Modelle direkt dorthin (MACVIBES_LOCAL_UPSTREAM_URL, Default
# http://localhost:8000). Die Bridge wird nur gestartet, wenn ~/macvibes/litellm.yaml
# existiert (legt `bun run setup` für OpenAI-kompatible Anbieter an) oder
# MACVIBES_LITELLM_AUTOSTART=1 gesetzt ist; manuell: `bun run router`.
# Endpunkt der Bridge: http://localhost:8787 (MACVIBES_LITELLM_URL).
#
# EIGENE Änderungen gehören nicht hierher, sondern in eine Kopie unter
# ~/macvibes/litellm.yaml (existiert sie, nutzt der Router NUR noch sie;
# expliziter Pfad via MACVIBES_LOCAL_ROUTER_CONFIG): diese Datei liegt bei
# einer Installation in libexec und wird bei jedem brew upgrade ersetzt.

model_list:
  # Lokales Modell auch ÜBER die Bridge erreichbar (z. B. für Tools, die nur
  # mit LiteLLM reden sollen). oMLX bietet parallel /v1/chat/completions
  # (OpenAI-Format), LiteLLM übersetzt Anthropic <-> OpenAI. Der Name ist
  # derselbe wie im Katalog (agentModel.ts) und wie in ~/.omlx/models.
  - model_name: Qwen3.8-27B-oQ4e-mtp
    litellm_params:
      model: openai/Qwen3.8-27B-oQ4e-mtp
      api_base: http://localhost:8000/v1
      api_key: omlx

  # --- OpenRouter (optional) -------------------------------------------------
  # OpenRouter bietet NUR einen OpenAI-kompatiblen Endpunkt; diese Bridge
  # übersetzt Anthropic-/v1/messages darauf. Der Eintrag ist AKTIV, stört den
  # Start aber NICHT, solange OPENROUTER_API_KEY fehlt (empirisch verifiziert:
  # LiteLLM startet, `os.environ/…` bleibt bis zum ersten Aufruf ungenutzt).
  # Nutzen:
  #   1) OPENROUTER_API_KEY in apps/server/.env setzen (`bun run setup` erledigt das).
  #   2) Gewünschtes Modell hier als `model_name` führen (Slug von openrouter.ai).
  #   3) Denselben `model_name` in ~/macvibes/models.json aufnehmen
  #      ("slow": true empfohlen), damit er im Chat-Dropdown erscheint, und
  #      eine Route in MACVIBES_MODEL_ROUTES auf die Bridge legen
  #      (`bun run setup` erledigt beides).
  # Der `model_name` darf NICHT mit "claude" beginnen, sonst würde der
  # Credential-Proxy ihn an die Anthropic-API statt hierher routen.
  - model_name: openrouter/qwen/qwen3-coder
    litellm_params:
      model: openrouter/qwen/qwen3-coder
      api_key: os.environ/OPENROUTER_API_KEY
  # Weiteres OpenRouter-Beispiel (Claude via OpenRouter, Slug prüfen/anpassen):
  # - model_name: openrouter/anthropic/claude-sonnet-4.5
  #   litellm_params:
  #     model: openrouter/anthropic/claude-sonnet-4.5
  #     api_key: os.environ/OPENROUTER_API_KEY

  # --- OpenAI (optional) -----------------------------------------------------
  # Gleiches Muster über OPENAI_API_KEY. Auch aktiv ohne gesetzten Key
  # unbedenklich (erst der Aufruf braucht ihn).
  - model_name: openai/gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Catch-all: Claude Code ruft intern Hilfsmodelle auf (claude-*-haiku etc.).
  # Ohne diesen Eintrag antwortet der Router darauf mit 400 → der Agent stolpert.
  - model_name: '*'
    litellm_params:
      model: openai/Qwen3.8-27B-oQ4e-mtp
      api_base: http://localhost:8000/v1
      api_key: omlx

litellm_settings:
  drop_params: true # unbekannte Anthropic-Felder (z. B. thinking) verwerfen statt Fehler
  telemetry: false

general_settings:
  # Lokal, kein Auth — macvibes' Proxy setzt zwar x-api-key, der Router ignoriert ihn.
  master_key: null
